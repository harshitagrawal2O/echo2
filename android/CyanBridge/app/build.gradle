        buildConfig = true
        compose = true
        aidl = true
    }

    // MYVU's protocol is maintained as a pinned upstream submodule. The source
    // contains the hardware-verified StarryNet BLE/ECDH/RFCOMM implementation.
    sourceSets {
        main {
            java.srcDir("src/main/myvu-upstream/android/app/src/main/java")
            assets.srcDir("src/main/myvu-upstream/android/app/src/main/assets")
            java.exclude("com/myvu/client/ui/**")
            java.exclude("com/myvu/client/service/MyvuService.java")
            java.exclude("com/myvu/client/service/MirrorNotificationListener.java")

            // Exactly one of these is compiled. Both define MetaRaybanManager and
            // MetaCameraPermission with identical public surfaces; src/meta talks to the Wearables
            // DAT SDK, src/nometa reports "unavailable" for everything. Keeping the two in step is
            // a maintenance obligation — a member added to one and not the other breaks whichever
            // variant was not built.
            java.srcDir(metaDatEnabled ? "src/meta/java" : "src/nometa/java")
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// VariantSourceSetParityTest reads src/meta and src/nometa as text, and Gradle cannot infer that.
// Without this it goes UP-TO-DATE and silently does not run when a twin changes — and worst on the
// side it exists to protect, because the default variant does not compile src/meta at all, so
// editing that twin invalidates nothing. A parity guard that skips itself is not a guard.
// Both directories are also handed to the test explicitly rather than left to be inferred from the
// process working directory. That directory is not contractual across Gradle versions and IDE
// runners, and it varies with the shape of the path the project is reached through — a directory
// junction onto a path containing a space, for instance. Resolving it here means the test uses the
// value Gradle already resolved, so it cannot pass on one checkout and fail on another for reasons
// unrelated to the sources it is comparing. Cost: an absolute path in the task's input fingerprint,
// so a move or a fresh clone re-runs it. It reads two directories and takes under a second.
tasks.withType(Test).configureEach {
    def metaSources = layout.projectDirectory.dir("src/meta/java").asFile
    def nometaSources = layout.projectDirectory.dir("src/nometa/java").asFile

    inputs.dir(metaSources)
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName("metaVariantSources")
    inputs.dir(nometaSources)
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName("nometaVariantSources")

    systemProperty "cyanbridge.metaSourceSet", metaSources.absolutePath
    systemProperty "cyanbridge.nometaSourceSet", nometaSources.absolutePath
}


